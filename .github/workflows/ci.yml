name: Keydso Maanta CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-and-verify:
    name: Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: |
          npm run build --workspace=packages/shared-types
          npm run build --workspace=packages/validation

      - name: Run Backend API Test Suites
        run: npm test --workspace=apps/api
        env:
          NODE_ENV: test
          JWT_SECRET: test-super-secret-ci-key-256bits-long!
          HMAC_SECRET: test-hmac-key-ci-environment-sha256!

      - name: Build Frontend PWA Production Bundle
        run: npm run build --workspace=apps/web

      - name: Verify PWA Distribution Assets
        run: |
          test -f apps/web/dist/index.html || exit 1
          test -f apps/web/dist/sw.js || exit 1
          test -f apps/web/dist/manifest.webmanifest || exit 1
          echo "PWA Service Worker and Manifest Verified Successfully."
